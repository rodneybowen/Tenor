name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Supabase credentials + Web Push VAPID public key must be present
      # at BUILD time — Vite inlines `import.meta.env.VITE_*` values into
      # the static bundle. Set all three as repo secrets:
      #   Settings → Secrets and variables → Actions → New repository secret
      #     • VITE_SUPABASE_URL        (Project URL, e.g. https://abc.supabase.co)
      #     • VITE_SUPABASE_ANON_KEY   (anon/public key — safe to ship)
      #     • VITE_VAPID_PUBLIC_KEY    (public half of the Web Push pair;
      #                                 private half is a Supabase Edge
      #                                 Function secret, NEVER here)
      # If they're missing the build still succeeds, but the deployed app
      # falls back to in-memory mocks / web push subscription is skipped.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
